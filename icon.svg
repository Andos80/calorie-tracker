  <path d="M 256 215 C 262 195 294 165 288 112 C 266 130 250 175 256 215 Z" fill="white"/>
  <rect x="250" y="195" width="12" height="30" rx="6" fill="white"/>

  <!-- Wide salad bowl rim -->
  <rect x="92" y="218" width="328" height="44" rx="22" fill="white"/>

  <!-- Bowl body — wide and shallow, proper salad bowl proportions -->
  <path d="M 120 262 Q 108 368 256 376 Q 404 368 392 262 Z" fill="white"/>

  <!-- Bowl base stem -->
  <rect x="232" y="376" width="48" height="32" fill="white"/>
  <!-- Bowl foot -->
  <rect x="180" y="400" width="152" height="36" rx="18" fill="white"/>

  <!-- Colorful food dots inside bowl -->
